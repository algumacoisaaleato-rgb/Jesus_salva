<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Namaguederaz</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh;background:#000}.splash{height:100vh;display:grid;place-items:center;font-size:34px;font-weight:800;letter-spacing:2px}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #202020;position:sticky;top:0;background:#000;z-index:5}.brand{font-weight:800}.icon{background:none;border:0;font-size:25px}.content{padding:18px;max-width:900px;margin:auto}.empty{height:55vh;display:grid;place-items:center;text-align:center;color:#aaa}.fab{position:fixed;right:20px;bottom:24px;width:58px;height:58px;border-radius:50%;border:0;background:#fff;color:#000;font-size:32px;z-index:20}.rooms,.results{display:grid;gap:12px}.room,.video{border:1px solid #262626;border-radius:14px;padding:10px;background:#0b0b0b;display:flex;gap:12px;align-items:center;text-align:left}.room img,.video img{width:130px;height:74px;object-fit:cover;border-radius:9px}.room h3{margin:0 0 6px;font-size:16px}.muted{color:#999;font-size:13px}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:30;display:flex;align-items:flex-end}.panel{background:#0b0b0b;width:100%;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow:auto}.platform{display:block;width:100%;padding:17px;margin:8px 0;border:1px solid #292929;border-radius:12px;background:#111;text-align:left}.search{display:flex;gap:8px;margin:12px 0}.search input{flex:1;background:#111;border:1px solid #333;color:#fff;border-radius:10px;padding:12px}.search button,.primary{background:#fff;color:#000;border:0;border-radius:10px;padding:12px 16px;font-weight:700}.video{width:100%}.video img{width:145px;height:82px}.watch iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#111}.watch h2{font-size:18px}.video-wrap{position:relative}.create-overlay{position:absolute;left:12px;bottom:12px;background:#fff;color:#000;border:0;border-radius:10px;padding:11px 15px;font-weight:700;box-shadow:0 5px 20px #000}.actions{display:flex;gap:8px;flex-wrap:wrap}.chat{margin-top:16px;border:1px solid #222;border-radius:12px;padding:12px}.messages{height:180px;overflow:auto;margin-bottom:10px}.msg{padding:5px 0}.settings .row{display:flex;justify-content:space-between;align-items:center;padding:17px 0;border-bottom:1px solid #222}.toggle{width:48px;height:28px;border-radius:20px;border:0;background:#333}.toggle.on{background:#fff}.toggle span{display:block;width:20px;height:20px;border-radius:50%;background:#777;margin:4px}.toggle.on span{background:#000;margin-left:24px}.error{color:#f66;margin:8px 0}.status{margin:10px 0;color:#aaa}.hidden{display:none!important}@media(max-width:600px){.video img{width:115px;height:65px}.room img{width:110px;height:62px}}
</style>
</head>
<body><div id="root"></div>
<script>
const API='https://namaguederazjaspionvaitomando.onrender.com';
const WS='wss://namaguederazjaspionvaitomando.onrender.com';
const root=document.getElementById('root');
let state={page:'home',platform:null,query:'',results:[],video:null,room:null,rooms:[],ws:null,chat:[],player:null,createVisible:false,settings:{autoplay:true,rememberPlatform:true}};
try{state.settings={...state.settings,...JSON.parse(localStorage.getItem('nmz-settings')||'{}')}}catch{}
function saveSettings(){localStorage.setItem('nmz-settings',JSON.stringify(state.settings))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(page,extra={}){history.pushState({page,...extra},'',location.pathname+'#'+page);state.page=page;Object.assign(state,extra);render()}
function closeSocket(){if(state.ws){try{state.ws.close()}catch{}state.ws=null}}
function render(){
 let h='<div class="app"><header class="top"><b class="brand">Namaguederaz</b><button class="icon" id="settings" aria-label="Configurações">⚙</button></header>';
 if(state.page==='home')h+=home(); else if(state.page==='platforms')h+=platforms(); else if(state.page==='search')h+=search(); else if(state.page==='watch')h+=watch(false); else if(state.page==='room')h+=watch(true); else if(state.page==='settings')h+=settings(); else h+=home();
 h+='</div>';root.innerHTML=h;bind();
 if((state.page==='watch'||state.page==='room')&&window.YT)requestAnimationFrame(initPlayer);
}
function home(){return '<main class="content"><h2>Salas públicas</h2>'+(state.rooms.length?'<div class="rooms">'+state.rooms.map(r=>'<button class="room" data-room="'+esc(r.id)+'"><img src="'+esc(r.thumb||'')+'"><div><h3>'+esc(r.title)+'</h3><span class="muted">'+(Number(r.clients)||0)+' participante(s)</span></div></button>').join('')+'</div>':'<div class="empty"><div>Nenhuma sala pública disponível.<br><span class="muted">Quando alguém criar uma sala pública, ela aparecerá aqui.</span></div></div>')+'</main><button class="fab" id="plus" aria-label="Criar ou procurar sala">+</button>'}
function platforms(){return '<main class="content"><h2>Escolha uma plataforma</h2><button class="platform" data-platform="YouTube"><b>YouTube</b><div class="muted">Pesquisar e assistir dentro do Namaguederaz</div></button><button class="platform" data-platform="Netflix"><b>Netflix</b><div class="muted">Disponível somente conforme a integração permitida pelo serviço</div></button><button class="platform" data-platform="Chrome"><b>Chrome</b><div class="muted">Navegação interna somente onde a página permitir incorporação</div></button></main>'}
function search(){return '<main class="content"><h2>YouTube</h2><div class="search"><input id="q" value="'+esc(state.query)+'" placeholder="Pesquisar no YouTube" autocomplete="off"><button id="searchBtn">Pesquisar</button></div><div id="err"></div><div class="results">'+state.results.map(v=>'<button class="video" data-video="'+esc(v.videoId)+'"><img src="'+esc(v.thumb)+'"><div><b>'+esc(v.title)+'</b><div class="muted">'+esc(v.channelTitle)+'</div></div></button>').join('')+'</div></main>'}
function watch(inRoom){const v=state.video;if(!v)return '<main class="content"><div class="empty">Vídeo não selecionado.</div></main>';const src='https://www.youtube.com/embed/'+encodeURIComponent(v.videoId)+'?enablejsapi=1&playsinline=1&rel=0&autoplay='+(state.settings.autoplay?1:0);return '<main class="content watch"><div class="video-wrap"><iframe id="player" src="'+src+'" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>'+(!inRoom&&state.createVisible?'<button class="create-overlay" id="create">Criar sala</button>':'')+'</div><h2>'+esc(v.title)+'</h2>'+(inRoom?'<div class="actions"><span class="muted">Sala: '+esc(state.room.title)+'</span></div><div class="chat"><div class="messages" id="messages"></div><div class="search"><input id="chatInput" placeholder="Mensagem" maxlength="1000"><button id="sendChat">Enviar</button></div><div class="muted" id="users">Conectando...</div></div>':'<div class="status">Toque no vídeo para mostrar as opções da sala.</div>')+'</main>'}
function settings(){return '<main class="content settings"><h2>Configurações</h2><div class="row"><span>Reprodução automática</span><button class="toggle '+(state.settings.autoplay?'on':'')+'" id="auto"><span></span></button></div><div class="row"><span>Lembrar plataforma escolhida</span><button class="toggle '+(state.settings.rememberPlatform?'on':'')+'" id="remember"><span></span></button></div><div class="row"><span>Plataforma lembrada</span><span class="muted">'+esc(localStorage.getItem('nmz-platform')||'Nenhuma')+'</span></div><div class="row"><span>Dados locais</span><button class="primary" id="clear">Limpar</button></div></main>'}
async function loadRooms(){try{const r=await fetch(API+'/api/rooms',{cache:'no-store'});const d=await r.json();if(!r.ok||!Array.isArray(d))throw Error();state.rooms=d;if(state.page==='home')render()}catch{state.rooms=[];if(state.page==='home')render()}}
async function doSearch(){const input=document.getElementById('q');const q=input?.value.trim();if(!q)return;state.query=q;const err=document.getElementById('err');if(err)err.innerHTML='<div class="status">Pesquisando...</div>';try{const r=await fetch(API+'/api/youtube/search?q='+encodeURIComponent(q),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Erro na busca');state.results=Array.isArray(d.items)?d.items:[];render()}catch(e){if(err)err.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function createRoom(){if(!state.video?.videoId)return;const pub=confirm('OK = sala pública\nCancelar = sala privada');try{const r=await fetch(API+'/api/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:state.video.title,pickedId:state.video.videoId,thumb:state.video.thumb,public:pub})});const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível criar a sala');state.room=d;state.chat=[];nav('room',{room:d});connect()}catch(e){alert(e.message)}}
let ytPlayer=null,syncing=false,playerReady=false;
function initPlayer(){const el=document.getElementById('player');if(!el||!window.YT?.Player)return;if(ytPlayer&&ytPlayer.getIframe?.()===el)return;ytPlayer=new YT.Player('player',{events:{onReady:()=>{playerReady=true},onStateChange:e=>{if(!state.room||syncing||!state.ws||state.ws.readyState!==1||!ytPlayer)return;const action=e.data===1?'play':e.data===2?'pause':null;if(action)state.ws.send(JSON.stringify({type:'room-event',event:{kind:'playback',action,time:Number(ytPlayer.getCurrentTime())||0}}))}}})}
function connect(){closeSocket();if(!state.room)return;try{state.ws=new WebSocket(WS);state.ws.onopen=()=>state.ws.send(JSON.stringify({type:'join-room',roomId:state.room.id}));state.ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='room-users'){const u=document.getElementById('users');if(u)u.textContent=(Number(m.count)||0)+' participante(s)'}if(m.type==='room-event'&&m.event?.kind==='chat'){appendMessage(m.event)}if(m.type==='room-event'&&m.event?.kind==='playback'&&ytPlayer){syncing=true;try{ytPlayer.seekTo(Number(m.event.time)||0,true);if(m.event.action==='play')ytPlayer.playVideo();else ytPlayer.pauseVideo()}catch{}setTimeout(()=>syncing=false,700)}if(m.type==='error')alert(m.error)}}catch{state.ws=null}}
function appendMessage(m){const box=document.getElementById('messages');if(!box)return;const div=document.createElement('div');div.className='msg';const b=document.createElement('b');b.textContent=String(m.name||'Amigo')+':';div.appendChild(b);div.appendChild(document.createTextNode(' '+String(m.text||'')));box.appendChild(div);box.scrollTop=box.scrollHeight}
function sendChat(){const i=document.getElementById('chatInput');const text=i?.value.trim();if(!text||!state.ws||state.ws.readyState!==1)return;const m={name:'Você',text};state.ws.send(JSON.stringify({type:'room-event',event:{kind:'chat',...m}}));appendMessage(m);i.value='';}
function bind(){document.getElementById('settings')?.addEventListener('click',()=>nav('settings'));document.getElementById('plus')?.addEventListener('click',()=>nav('platforms'));document.querySelectorAll('[data-platform]').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.platform;state.platform=p;if(state.settings.rememberPlatform)localStorage.setItem('nmz-platform',p);if(p==='YouTube')nav('search',{platform:p});else alert('Esta plataforma só será ativada quando houver uma integração permitida pelo próprio serviço.');}));document.getElementById('searchBtn')?.addEventListener('click',doSearch);document.getElementById('q')?.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});document.querySelectorAll('[data-video]').forEach(b=>b.addEventListener('click',()=>{const v=state.results.find(x=>x.videoId===b.dataset.video);if(!v)return;state.video=v;state.createVisible=false;nav('watch')}));document.getElementById('player')?.addEventListener('click',()=>{state.createVisible=true;render()});document.getElementById('create')?.addEventListener('click',createRoom);document.querySelectorAll('[data-room]').forEach(b=>b.addEventListener('click',async()=>{const id=b.dataset.room,r=state.rooms.find(x=>x.id===id);if(!r)return;state.video={videoId:r.pickedId,title:r.title,thumb:r.thumb||''};try{const x=await fetch(API+'/api/rooms/'+encodeURIComponent(id)+'/join',{method:'POST'}),d=await x.json();if(!x.ok)throw Error(d.error||'Sala indisponível');state.room=d;state.chat=[];nav('room',{room:d});connect()}catch(e){alert(e.message)}}));document.getElementById('auto')?.addEventListener('click',()=>{state.settings.autoplay=!state.settings.autoplay;saveSettings();render()});document.getElementById('remember')?.addEventListener('click',()=>{state.settings.rememberPlatform=!state.settings.rememberPlatform;saveSettings();render()});document.getElementById('clear')?.addEventListener('click',()=>{localStorage.removeItem('nmz-settings');localStorage.removeItem('nmz-platform');state.settings={autoplay:true,rememberPlatform:true};render()});document.getElementById('sendChat')?.addEventListener('click',sendChat);document.getElementById('chatInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()})}
window.addEventListener('popstate',e=>{const s=e.state||{page:'home'};state.page=s.page||'home';if(s.platform!==undefined)state.platform=s.platform;if(s.room!==undefined)state.room=s.room;if(state.page!=='room')closeSocket();if(state.page!=='watch')state.createVisible=false;render()});
history.replaceState({page:'home'},'',location.pathname+'#home');
const ytScript=document.createElement('script');ytScript.src='https://www.youtube.com/iframe_api';document.head.appendChild(ytScript);window.onYouTubeIframeAPIReady=()=>{if(state.page==='watch'||state.page==='room')initPlayer()};
root.innerHTML='<div class="splash">NAMAGUEDERAZ</div>';setTimeout(()=>{render();loadRooms()},900);setInterval(()=>{if(state.page==='home')loadRooms()},10000);
</script></body></html>
